<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-header">
      <h1>Casa C</h1>
      <p>Crea tu cuenta de inversor</p>
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="displayName">Nombre completo</label>
        <input
          id="displayName"
          type="text"
          name="displayName"
          [(ngModel)]="displayName"
          placeholder="Edgar Chaux"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="inversor@casac.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña (mín. 6 caracteres)</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      @if (successMessage) {
        <div class="success-banner">{{ successMessage }}</div>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <div class="switch-auth">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </div>
  </div>
</div>
